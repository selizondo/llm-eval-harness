[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "LLM-as-judge evaluation harness with regression detection and SQLite result storage"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49",
    "rich>=13.7",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.uv]
constraint-dependencies = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
